[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "idx-ohlcv-platform"
version = "0.1.0"
description = "Restartable IDX daily OHLCV ingestion and internal API"
requires-python = ">=3.11"
dependencies = [
  "curl-cffi>=0.10,<1",
  "duckdb>=1.2,<2",
  "fastapi>=0.115,<1",
  "pandas>=2.2,<3",
  "polars>=1.24,<2",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "redis>=5,<7",
  "sqlalchemy>=2.0,<3",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
idx-platform = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
