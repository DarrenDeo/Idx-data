x-platform-environment: &platform-environment
  DATABASE_URL: postgresql+psycopg://idx:${POSTGRES_PASSWORD:-change-me}@postgres:5432/idx
  IDX_BASE_URL: ${IDX_BASE_URL:-https://www.idx.co.id/primary}
  IDX_CONCURRENCY: ${IDX_CONCURRENCY:-5}
  IDX_REQUEST_TIMEOUT: ${IDX_REQUEST_TIMEOUT:-30}
  IDX_TOTAL_TIMEOUT: ${IDX_TOTAL_TIMEOUT:-60}
  IDX_MAX_RETRIES: ${IDX_MAX_RETRIES:-5}
  IDX_REQUEST_DELAY: ${IDX_REQUEST_DELAY:-0.25}
  IDX_BACKFILL_START: ${IDX_BACKFILL_START:-2000-01-01}
  IDX_BACKFILL_END: ${IDX_BACKFILL_END:-}
  REDIS_URL: redis://redis:6379/0

x-airflow-environment: &airflow-environment
  <<: *platform-environment
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Jakarta
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://idx:${POSTGRES_PASSWORD:-change-me}@postgres:5432/idx
  AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
  AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-change-me}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-idx}
      POSTGRES_USER: ${POSTGRES_USER:-idx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/10-idx-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idx} -d ${POSTGRES_DB:-idx}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment: *platform-environment
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12

  scheduler:
    profiles: ["server"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["python", "-m", "app.scheduler"]
    environment:
      <<: *platform-environment
      SCHEDULER_HOUR: ${SCHEDULER_HOUR:-18}
      SCHEDULER_MINUTE: ${SCHEDULER_MINUTE:-0}
      TZ: Asia/Jakarta
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      REDIS_URL: ""

  airflow-init:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: Dockerfile.airflow
    environment: *airflow-environment
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        (airflow users create --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" --firstname IDX --lastname Admin --role Admin --email admin@example.invalid || true)
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: Dockerfile.airflow
    environment: *airflow-environment
    command: webserver
    restart: unless-stopped
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
    ports:
      - "127.0.0.1:${AIRFLOW_HOST_PORT:-18080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: Dockerfile.airflow
    environment: *airflow-environment
    command: scheduler
    restart: unless-stopped
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  public-nginx:
    profiles: ["server"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PUBLIC_HOST_PORT:-18474}:80"
    volumes:
      - ./nginx/public.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-19090}:9090"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-13000}:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:
